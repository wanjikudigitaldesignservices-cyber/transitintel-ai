# ============================================================================
# TransitIntel AI — Kubernetes Secrets & ConfigMap
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: transitintel-secrets
  namespace: transitintel
  labels:
    app.kubernetes.io/name: transitintel
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:postgres@transitintel-postgres:5432/transitintel?schema=public"
  NEXTAUTH_SECRET: "production-secret-change-this-to-a-real-secret-min-32-chars"
  REDIS_URL: "redis://transitintel-redis:6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transitintel-config
  namespace: transitintel
  labels:
    app.kubernetes.io/name: transitintel
data:
  NODE_ENV: "production"
  NEXTAUTH_URL: "https://transitintel.example.com"
  NEXT_PUBLIC_APP_URL: "https://transitintel.example.com"
  NEXT_PUBLIC_APP_NAME: "TransitIntel AI"
  AI_CONFIDENCE_THRESHOLD: "0.7"
