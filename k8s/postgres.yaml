# ============================================================================
# TransitIntel AI — PostgreSQL StatefulSet
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: transitintel-postgres
  namespace: transitintel
  labels:
    app.kubernetes.io/name: transitintel-postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: transitintel-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: transitintel-postgres
  namespace: transitintel
  labels:
    app.kubernetes.io/name: transitintel-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: transitintel-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transitintel-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transitintel-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transitintel-db-secret
                  key: password
                  optional: true
            - name: POSTGRES_DB
              value: "transitintel"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
# DB Secret (separate so it can be managed independently)
apiVersion: v1
kind: Secret
metadata:
  name: transitintel-db-secret
  namespace: transitintel
type: Opaque
stringData:
  password: "postgres"
