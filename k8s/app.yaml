# ============================================================================
# TransitIntel AI — Application Deployment + Service + Ingress + HPA
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transitintel-app
  namespace: transitintel
  labels:
    app.kubernetes.io/name: transitintel-app
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: transitintel-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transitintel-app
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: app
          image: transitintel-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: transitintel-config
            - secretRef:
                name: transitintel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      terminationGracePeriodSeconds: 30
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: transitintel-app
  namespace: transitintel
  labels:
    app.kubernetes.io/name: transitintel-app
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: transitintel-app
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transitintel-ingress
  namespace: transitintel
  labels:
    app.kubernetes.io/name: transitintel-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - transitintel.example.com
      secretName: transitintel-tls
  rules:
    - host: transitintel.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transitintel-app
                port:
                  number: 80
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transitintel-app-hpa
  namespace: transitintel
  labels:
    app.kubernetes.io/name: transitintel-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transitintel-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
