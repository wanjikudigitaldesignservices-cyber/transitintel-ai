# ============================================================================
# TransitIntel AI — Redis Deployment
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: transitintel-redis
  namespace: transitintel
  labels:
    app.kubernetes.io/name: transitintel-redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: transitintel-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transitintel-redis
  namespace: transitintel
  labels:
    app.kubernetes.io/name: transitintel-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transitintel-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transitintel-redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
